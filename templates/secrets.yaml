{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "posthog.secretName" . }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.secretKey }}: {{ include "posthog.generatedSecretValue" (dict "root" . "key" .Values.secrets.keys.secretKey "value" .Values.secrets.values.secretKey "length" 50) | quote }}
  {{ .Values.secrets.keys.encryptionSaltKeys }}: {{ include "posthog.generatedSecretValue" (dict "root" . "key" .Values.secrets.keys.encryptionSaltKeys "value" .Values.secrets.values.encryptionSaltKeys "length" 32) | quote }}
  {{ .Values.secrets.keys.clickhousePassword }}: {{ .Values.secrets.values.clickhousePassword | quote }}
  {{ .Values.secrets.keys.clickhouseApiPassword }}: {{ include "posthog.generatedSecretValue" (dict "root" . "key" .Values.secrets.keys.clickhouseApiPassword "value" .Values.secrets.values.clickhouseApiPassword "length" 32) | quote }}
  {{ .Values.secrets.keys.objectStorageAccessKey }}: {{ .Values.secrets.values.objectStorageAccessKey | quote }}
  {{ .Values.secrets.keys.objectStorageSecretKey }}: {{ .Values.secrets.values.objectStorageSecretKey | quote }}
  {{ .Values.secrets.keys.sessionRecordingAccessKey }}: {{ .Values.secrets.values.sessionRecordingAccessKey | quote }}
  {{ .Values.secrets.keys.sessionRecordingSecretKey }}: {{ .Values.secrets.values.sessionRecordingSecretKey | quote }}
  {{ .Values.secrets.keys.captureLogsJwtSecret }}: {{ include "posthog.generatedSecretValue" (dict "root" . "key" .Values.secrets.keys.captureLogsJwtSecret "value" .Values.secrets.values.captureLogsJwtSecret "length" 32) | quote }}
  {{ .Values.secrets.keys.livestreamJwtSecret }}: {{ include "posthog.generatedSecretValue" (dict "root" . "key" .Values.secrets.keys.livestreamJwtSecret "value" .Values.secrets.values.livestreamJwtSecret "length" 32) | quote }}
  {{ .Values.secrets.keys.internalApiSecret }}: {{ include "posthog.generatedSecretValue" (dict "root" . "key" .Values.secrets.keys.internalApiSecret "value" .Values.secrets.values.internalApiSecret "length" 32) | quote }}
  {{ .Values.secrets.keys.browserlessToken }}: {{ include "posthog.generatedSecretValue" (dict "root" . "key" .Values.secrets.keys.browserlessToken "value" .Values.secrets.values.browserlessToken "length" 32) | quote }}
{{- end }}
