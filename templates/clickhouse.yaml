{{- if .Values.clickhouse.enabled -}}
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: {{ .Values.internal.clickhouse.host }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
spec:
  configuration:
    {{- if .Values.zookeeper.enabled }}
    zookeeper:
      nodes:
        - host: zookeeper
          port: {{ .Values.zookeeper.service.ports.client }}
    {{- end }}
    clusters:
      - name: {{ .Values.clickhouse.clusterName }}
        layout:
          shardsCount: 1
          replicasCount: {{ .Values.clickhouse.replicas }}
    users:
      app/profile: default
      app/quota: default
      app/networks/ip:
        - "::/0"
        - 0.0.0.0/0
      app/grants/query: GRANT ALL ON *.*
      app/password:
        valueFrom:
          secretKeyRef:
            name: {{ include "posthog.secretName" . }}
            key: {{ .Values.secrets.keys.clickhousePassword }}
      api/profile: default
      api/quota: default
      api/networks/ip:
        - "::/0"
        - 0.0.0.0/0
      api/password: apipass
    settings:
      kafka_hosts: {{ tpl .Values.clickhouse.config.kafkaHosts . | quote }}
      macros/hostClusterType: {{ .Values.clickhouse.macros.hostClusterType | quote }}
      macros/hostClusterRole: {{ .Values.clickhouse.macros.hostClusterRole | quote }}
    files:
      {{- if .Values.clickhouse.systemLogs.trim }}
      # ClickHouse writes its own diagnostics into system tables every second,
      # whether or not anything is being ingested. On an idle deployment they
      # reached 66.9 GiB against 3.6 GiB of actual PostHog data -- 19x -- with
      # asynchronous_metric_log alone holding 16 billion rows, and most of the
      # tables carrying no TTL at all, so they grow without bound.
      #
      # The ones removed here are pure profiling and duplicate what is already
      # available elsewhere: text_log repeats the server log that is on stdout,
      # trace_log and processors_profile_log are for profiling sessions, and the
      # metric logs duplicate what Prometheus already scrapes. The ones kept are
      # the ones actually used when debugging a slow query or a merge problem,
      # and they get a retention window.
      config.d/posthog_system_logs.xml: |
        <clickhouse>
          {{- range .Values.clickhouse.systemLogs.disabled }}
          <{{ . }} remove="1"/>
          {{- end }}
          {{- range .Values.clickhouse.systemLogs.retained }}
          <{{ . }}>
            <ttl>event_date + INTERVAL {{ $.Values.clickhouse.systemLogs.ttlDays }} DAY DELETE</ttl>
          </{{ . }}>
          {{- end }}
        </clickhouse>
      {{- end }}
      config.d/posthog_named_collections.xml: |
        <clickhouse>
          <named_collections>
          {{- range .Values.clickhouse.namedCollections }}
            <{{ . }}>
              <kafka_broker_list>{{ tpl $.Values.clickhouse.config.kafkaHosts $ }}</kafka_broker_list>
            </{{ . }}>
          {{- end }}
          </named_collections>
        </clickhouse>
  defaults:
    templates:
      podTemplate: clickhouse
      dataVolumeClaimTemplate: data
  templates:
    podTemplates:
      - name: clickhouse
        spec:
          containers:
            - name: clickhouse
              image: {{ .Values.clickhouse.image | quote }}
    volumeClaimTemplates:
      - name: data
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: {{ .Values.clickhouse.storage | quote }}
{{- end }}
