  # Install ordering. Helm creates pre-install hooks before anything else in
  # the release, so a pre-install job that uses the chart's ServiceAccount and
  # Secret, or the bundled databases, can never start on a fresh install. The
  # init jobs therefore run post-install, when everything exists, and
  # pre-upgrade, when everything already existed. Argo CD ignores Helm hook
  # annotations once its own are present: as Sync hooks the jobs are created
  # with the rest of the sync and wait for their dependencies inside the pod.
  # Every wait is bounded, so a missing dependency fails the job instead of
  # hanging the install.
  migrate:
    enabled: true
    kind: Job
    image: app
    hook: post-install,pre-upgrade
    hookWeight: 0
    activeDeadlineSeconds: 3600
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
    annotations:
      argocd.argoproj.io/hook: Sync
      argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    command: ["/bin/sh", "-c"]
    args:
      - |
        set -e
        if [ -n "${CLICKHOUSE_HOST:-}" ]; then
          for attempt in $(seq 1 150); do
            if python -c 'import os; from clickhouse_driver import Client; Client(host=os.environ["CLICKHOUSE_HOST"], user=os.environ.get("CLICKHOUSE_USER", "default"), password=os.environ.get("CLICKHOUSE_PASSWORD", ""), secure=os.environ.get("CLICKHOUSE_SECURE", "false").lower() == "true", verify=os.environ.get("CLICKHOUSE_VERIFY", "false").lower() == "true").execute("SYSTEM FLUSH LOGS")'; then
              break
            fi
            if [ "$attempt" -eq 150 ]; then
              echo "ClickHouse log preflight failed" >&2
              exit 1
            fi
            sleep 2
          done
        fi
        exec ./bin/migrate
  asyncMigrationsCheck:
    enabled: true
    kind: Job
    image: app
    hook: post-install,post-upgrade
    hookWeight: 10
    activeDeadlineSeconds: 900
    annotations:
      argocd.argoproj.io/hook: PostSync
      argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    command: ["python", "manage.py", "run_async_migrations", "--check"]
    env:
      SKIP_ASYNC_MIGRATIONS_SETUP: "0"
  kafkaInit:
    enabled: true
    kind: Job
    image: redpandaTools
    hook: post-install,pre-upgrade
    hookWeight: -5
    activeDeadlineSeconds: 900
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
    annotations:
      argocd.argoproj.io/hook: Sync
      argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    command: ["/bin/sh", "-c"]
    args:
      - |
        set -e
        for attempt in $(seq 1 150); do
          if rpk topic list --brokers "${KAFKA_HOSTS}" >/dev/null 2>&1; then
            break
          fi
          if [ "$attempt" -eq 150 ]; then
            echo "Kafka at ${KAFKA_HOSTS} not reachable after 5 minutes" >&2
            exit 1
          fi
          sleep 2
        done
        topics="{{ range .Values.kafka.topics }} {{ . }}{{ end }}"
        for topic in $topics; do
          if rpk topic create "$topic" --brokers "${KAFKA_HOSTS}" -p {{ .Values.kafka.defaultPartitions }} -r {{ .Values.kafka.defaultReplicationFactor }}; then
            echo "Created Kafka topic $topic"
          elif rpk topic list --brokers "${KAFKA_HOSTS}" | awk '{print $1}' | grep -Fxq "$topic"; then
            echo "Kafka topic $topic already exists"
          else
            echo "Failed to create Kafka topic $topic"
            exit 1
          fi
        done
  proxy:
    enabled: false
    kind: Deployment
    image: caddy
    replicas: 1
    command: ["sh", "-c"]
    args: ["caddy run --config /etc/caddy/Caddyfile"]
    ports:
