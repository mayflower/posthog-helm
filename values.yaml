      POSTGRES_PWD: "{{ include \"posthog.postgresPasswordValue\" . }}"
      POSTGRES_SEEDS: "{{ include \"posthog.postgresHost\" . }}"
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      ENABLE_ES: "false"
    probes:
