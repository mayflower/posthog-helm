profile:
  mode: bundled

global:
  domain: posthog.local
  siteUrl: http://posthog.local
  deployment: hobby
  imagePullPolicy: Always
  imagePullSecrets: []
  labels: {}
  annotations: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  topologySpreadConstraints: []
  priorityClassName: ""
  allowMutableImageTags: true

subcharts:
  redpanda:
    enabled: true

kafka:
  defaultPartitions: 1
  defaultReplicationFactor: 1
  topics:
    - clickhouse_events_json
    - kafka_events_recent_json
    - clickhouse_person
    - clickhouse_person_overrides
    - clickhouse_person_unique_id
    - clickhouse_person_distinct_id
    - clickhouse_person_distinct_id_overrides
    - clickhouse_person_distinct_id2
    - events_plugin_ingestion
    - events_plugin_ingestion_dlq
    - events_plugin_ingestion_overflow
    - events_plugin_ingestion_async
    - events_plugin_ingestion_historical
    - plugin_log_entries
    - events_dead_letter_queue
    - clickhouse_groups
    - conversion_events_buffer
    - clickhouse_ingestion_warnings
    - clickhouse_app_metrics
    - clickhouse_app_metrics2
    - clickhouse_metrics_time_to_see_data
    - session_recording_events
    - session_recording_snapshot_item_events
    - session_recording_snapshot_item_overflow
    - session_recording_snapshot_item_dlq
    - clickhouse_session_recording_events
    - clickhouse_session_replay_events
    - clickhouse_session_replay_features
    - clickhouse_performance_events
    - clickhouse_heatmap_events
    - clickhouse_ai_events_json
    - log_entries
    - cdp_function_overflow
    - cdp_internal_events
    - cdp_cyclotron_hog
    - cdp_cyclotron_hogflow
    - clickhouse_behavioral_cohorts_matches
    - clickhouse_prefiltered_events
    - clickhouse_precalculated_person_properties
    - cdp_backfill_events
    - cohort_membership_changed
    - cdp_batch_hogflow_requests
    - cdp_data_warehouse_source_table
    - data_warehouse_source_webhooks
    - data_warehouse_source_webhooks_dlq
    - data_warehouse_sources_jobs
    - data_warehouse_sources_jobs_dlq
    - ingestion-errortracking-main
    - ingestion-errortracking-main-dlq
    - ingestion-errortracking-overflow
    - clickhouse_error_tracking_issue_fingerprint
    - clickhouse_error_tracking_issue_fingerprint_overrides
    - clickhouse_error_tracking_fingerprint_issue_state
    - clickhouse_error_tracking_issue_fingerprint_embeddings
    - clickhouse_document_embeddings
    - document_embeddings_input
    - logs_ingestion
    - logs_ingestion_dlq
    - logs_ingestion_overflow
    - clickhouse_logs
    - ingestion-traces
    - ingestion-traces-dlq
    - ingestion-traces-overflow
    - clickhouse_traces
    - clickhouse_tophog
    - distinct_id_usage_events_json
    - clickhouse_property_values
    - notification_events
    - signals_report_completed

secrets:
  create: true
  existingSecret: ""
  keys:
    secretKey: SECRET_KEY
    encryptionSaltKeys: ENCRYPTION_SALT_KEYS
    clickhousePassword: CLICKHOUSE_PASSWORD
    objectStorageAccessKey: OBJECT_STORAGE_ACCESS_KEY_ID
    objectStorageSecretKey: OBJECT_STORAGE_SECRET_ACCESS_KEY
    sessionRecordingAccessKey: SESSION_RECORDING_V2_S3_ACCESS_KEY_ID
    sessionRecordingSecretKey: SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY
    captureLogsJwtSecret: CAPTURE_LOGS_JWT_SECRET
    livestreamJwtSecret: LIVESTREAM_JWT_SECRET
  values:
    secretKey: ""
    encryptionSaltKeys: ""
    clickhousePassword: apppass
    objectStorageAccessKey: object_storage_root_user
    objectStorageSecretKey: object_storage_root_password
    sessionRecordingAccessKey: any
    sessionRecordingSecretKey: any
    captureLogsJwtSecret: ""
    livestreamJwtSecret: ""

