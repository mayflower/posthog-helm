secrets:
  create: true
  existingSecret: ""
  keys:
    secretKey: SECRET_KEY
    encryptionSaltKeys: ENCRYPTION_SALT_KEYS
    clickhousePassword: CLICKHOUSE_PASSWORD
    objectStorageAccessKey: OBJECT_STORAGE_ACCESS_KEY_ID
    objectStorageSecretKey: OBJECT_STORAGE_SECRET_ACCESS_KEY
    sessionRecordingAccessKey: SESSION_RECORDING_V2_S3_ACCESS_KEY_ID
    sessionRecordingSecretKey: SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY
    captureLogsJwtSecret: CAPTURE_LOGS_JWT_SECRET
    livestreamJwtSecret: LIVESTREAM_JWT_SECRET
    internalApiSecret: INTERNAL_API_SECRET
    browserlessToken: BROWSERLESS_TOKEN
    clickhouseApiPassword: CLICKHOUSE_API_PASSWORD
    # PEM RSA private key the OAuth provider signs tokens with. Outside hobby
    # mode the migrate job provisions OAuth applications and fails without it.
    oidcRsaPrivateKey: OIDC_RSA_PRIVATE_KEY
    # Optional. recording-api refuses to start in production without auth: it
    # wants either RECORDING_API_JWT_SECRET, or RECORDING_API_ALLOW_LEGACY_SECRET
    # with INTERNAL_API_SECRET. Set this to the key holding the JWT secret in
    # your Secret; leave it empty to stay on the legacy path. Empty means the
    # variable is not injected at all, so installs with an externally managed
    # Secret that lacks the key keep working.
    recordingApiJwtSecret: ""
  # The generated values below are only minted once: on upgrades the chart
  # reads the existing Secret back (Helm lookup) and keeps what is there.
  # `helm template` and Argo CD cannot look anything up, so for GitOps set
  # secrets.existingSecret or fill in explicit values here.
  values:
    secretKey: ""
    encryptionSaltKeys: ""
    clickhousePassword: apppass
    objectStorageAccessKey: object_storage_root_user
    objectStorageSecretKey: object_storage_root_password
    sessionRecordingAccessKey: any
    sessionRecordingSecretKey: any
    captureLogsJwtSecret: ""
    livestreamJwtSecret: ""
    internalApiSecret: ""
    browserlessToken: ""
    clickhouseApiPassword: ""
    # Generated (2048-bit RSA) when empty; supply your own PEM to pin it.
    oidcRsaPrivateKey: ""

# Where the node image carries the MaxMind database. Override only if your
# image places it elsewhere; the components that use GeoIP will not start
# without it.
mmdbFileLocation: "/app/share/GeoLite2-City.mmdb"

# Every entry takes repository and tag, or repository and digest
# (sha256:...), which wins over the tag. podSecurityContext here is the
# family default for every component running the image: the node image
# switches to uid 10001, the Rust images to nobody (65534). The app image
# ends its Dockerfile as root and bin/docker-server drops privileges itself
# with setpriv, so it must start as root and carries only the seccomp
# profile; images with a named user carry no context either.
images:
  # The Django app image. Upstream's ghcr.io/posthog/posthog bundles the
  # ee/ directory, which is under the PostHog Enterprise License and is only
  # licensed for production use with a subscription. PostHog publishes no
  # image without it, so this chart defaults to a pure-MIT build from the
  # mayflower fork (github.com/mayflower/posthog, branch feat/foss-image):
  # ee/ replaced by a shim, the rest unchanged. It keeps upstream's uid 10001.
  # Pinned to the commit it was built from; the master tag starts moving once
  # that branch merges. Holders of an enterprise license can point this back
  # at ghcr.io/posthog/posthog.
  app:
    repository: ghcr.io/mayflower/posthog-foss
    tag: a6c726314d3e6c7cb3b878fdc87f39966a4bf5b9
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
  # nodejs/ carries no enterprise code, so upstream's image is MIT as is.
  # There is no node build at the FOSS commit yet; pin one to the same
  # source revision as the app image once the fork's CI publishes it, since
  # the two are released together upstream.
  node:
    repository: ghcr.io/posthog/posthog-node
    tag: master
    podSecurityContext: &posthogUser
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      seccompProfile:
        type: RuntimeDefault
  capture:
    repository: ghcr.io/posthog/posthog/capture
    tag: master
    podSecurityContext: &rustUser
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
  captureLogs:
    repository: ghcr.io/posthog/posthog/capture-logs
    tag: master
    podSecurityContext: *rustUser
  propertyDefs:
    repository: ghcr.io/posthog/posthog/property-defs-rs
    tag: master
    podSecurityContext: *rustUser
  featureFlags:
    repository: ghcr.io/posthog/posthog/feature-flags
    tag: master
    podSecurityContext: *rustUser
  personhogReplica:
    repository: ghcr.io/posthog/posthog/personhog-replica
    tag: master
    podSecurityContext: *rustUser
  personhogRouter:
    repository: ghcr.io/posthog/posthog/personhog-router
    tag: master
    podSecurityContext: *rustUser
  hypercache:
    repository: ghcr.io/posthog/posthog/hypercache-server
    tag: master
    podSecurityContext: *rustUser
  livestream:
    repository: ghcr.io/posthog/posthog/livestream
    tag: master
  cyclotronJanitor:
    repository: ghcr.io/posthog/posthog/cyclotron-janitor
    tag: master
    podSecurityContext: *rustUser
  cymbal:
    repository: ghcr.io/posthog/posthog/cymbal
    tag: master
    podSecurityContext: *rustUser
  embeddingWorker:
    repository: ghcr.io/posthog/posthog/embedding-worker
    tag: master
    podSecurityContext: *rustUser
  batchImportWorker:
    repository: ghcr.io/posthog/posthog/batch-import-worker
    tag: master
    podSecurityContext: *rustUser
  recordingRasterizer:
    repository: ghcr.io/posthog/posthog-recording-rasterizer
    tag: master
    podSecurityContext: *posthogUser
  redpandaTools:
    repository: docker.redpanda.com/redpandadata/redpanda
    tag: v26.1.6
  # Official images, as in upstream's compose stack. Both drop to their
  # service user through gosu only when started as root with the setuid
  # capabilities the chart removes, so the pods run as that uid directly.
  postgres:
    repository: postgres
    tag: 15.12-alpine
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 70
      runAsGroup: 70
      fsGroup: 70
      seccompProfile:
        type: RuntimeDefault
  zookeeper:
    repository: zookeeper
    tag: "3.9.3"
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
  caddy:
    repository: caddy
    tag: "2.10.2"
  maildev:
    repository: maildev/maildev
    tag: 2.0.5
  flower:
    repository: mher/flower
    tag: 2.0.0
  kafkaUi:
    # Maintained fork of the archived provectuslabs/kafka-ui; same env vars.
    repository: ghcr.io/kafbat/kafka-ui
    tag: v1.3.0
  temporal:
    repository: temporalio/auto-setup
    tag: 1.26.2
  temporalAdminTools:
    repository: temporalio/admin-tools
    tag: 1.26.2
  temporalUi:
    repository: temporalio/ui
    tag: 2.47.2
  elasticsearch:
    repository: elasticsearch
    tag: 7.17.28
  opensearch:
    repository: opensearchproject/opensearch
    tag: 2.13.0
  opensearchDashboards:
    repository: opensearchproject/opensearch-dashboards
    tag: 2.13.0
  azurite:
    repository: mcr.microsoft.com/azure-storage/azurite
    tag: 3.35.0
  webhookTester:
    repository: tarampampam/webhook-tester
    tag: 2.2.6
  otelCollector:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.142.0
  jaeger:
    repository: jaegertracing/all-in-one
    tag: 1.76.0
  localstack:
    repository: localstack/localstack
    tag: 4.12.0
  seaweedfs:
    # Upstream pins >= 4.05: 4.03 and 4.04 silently drop Content-Encoding
    # metadata, which breaks gzipped objects that rely on the header.
    repository: chrislusf/seaweedfs
    tag: "4.29"
  valkey:
    repository: valkey/valkey
    tag: 8.1-alpine
    # The image switches to its valkey user (999) only when started as root
    # with the setuid capabilities the chart drops, so run as it directly.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
      seccompProfile:
        type: RuntimeDefault
  browserless:
    repository: ghcr.io/browserless/chromium
    tag: v2.51.2
  duckgres:
    repository: ghcr.io/posthog/duckgres
    tag: 5cfca88a52f366765fcdb122056e7ad3f038ec4f
  etcd:
    repository: quay.io/coreos/etcd
    tag: v3.6.8

external:
  postgres:
    url: ""
    host: ""
    port: 5432
    database: posthog
    user: posthog
    sslMode: ""
    params: {}
    passwordSecret:
      name: ""
      key: password
  redis:
    url: ""
    host: ""
    port: 6379
    database: 0
    tls: false
    passwordSecret:
      name: ""
      key: password
  kafka:
    hosts: ""
  clickhouse:
    host: ""
    database: posthog
    user: app
    secure: "false"
    verify: "false"
    cluster: ""
    migrationsCluster: ""
    passwordSecret:
      name: ""
      key: password
  objectStorage:
    endpoint: ""
    publicEndpoint: ""
    bucket: posthog
    region: us-east-1
    accessKeySecret:
      name: ""
      key: access-key
    secretKeySecret:
      name: ""
      key: secret-key
  sessionRecording:
    endpoint: ""
    bucket: posthog
    region: us-east-1
    accessKeySecret:
      name: ""
      key: access-key
    secretKeySecret:
      name: ""
      key: secret-key
  # The CDP shadow store. Leave host empty to keep using the bundled valkey
  # component in external mode.
  valkey:
    host: ""
    port: 6379
    tls: false
    passwordSecret:
      name: ""
      key: password
  temporal:
    host: ""
    port: 7233
  opensearch:
    host: ""

internal:
  postgres:
    host: "{{ include \"posthog.serviceHost\" (dict \"root\" . \"name\" \"postgres\") }}"
    port: 5432
    database: posthog
    user: posthog
    password: posthog
    # Created on first start next to the main database, mirroring upstream's
    # docker/postgres-init-scripts.
    extraDatabases:
      - posthog_persons
      - posthog_flags
      - cyclotron
      - cyclotron_node
      - behavioral_cohorts
      - flags_read_store
      - ducklake
  redis:
    # The bundled Valkey component below; any Redis-compatible endpoint works.
    host: "{{ include \"posthog.serviceHost\" (dict \"root\" . \"name\" \"valkey\") }}"
    port: 6379
    database: 0
    tls: false
  kafka:
    hosts: kafka:9092
  clickhouse:
    host: clickhouse
    database: posthog
    user: app
    secure: "false"
    verify: "false"
    cluster: posthog
    migrationsCluster: ""
  objectStorage:
    # The bundled SeaweedFS component (objectStorage below).
    endpoint: "http://{{ include \"posthog.serviceHost\" (dict \"root\" . \"name\" \"objectStorage\") }}:9000"
    publicEndpoint: ""
    bucket: posthog
    region: us-east-1
    # Data warehouse and data modeling write Delta tables here.
    dataWarehouseBucket: data-warehouse
    # Created by the objectStorage component at startup.
    buckets:
      - posthog
      - ai-blobs
      - data-warehouse
      - ducklake-dev
  sessionRecording:
    endpoint: "http://{{ include \"posthog.serviceHost\" (dict \"root\" . \"name\" \"seaweedfs\") }}:8333"
    bucket: posthog
    region: us-east-1
    accessKey: any
    secretKey: any
  valkey:
    host: "{{ include \"posthog.serviceHost\" (dict \"root\" . \"name\" \"valkeyShadow\") }}"
    port: 6379
  temporal:
    host: "{{ include \"posthog.serviceHost\" (dict \"root\" . \"name\" \"temporal\") }}"
    port: 7233
  opensearch:
    host: "{{ include \"posthog.serviceHost\" (dict \"root\" . \"name\" \"opensearch\") }}:9200"

ingress:
  enabled: true
  className: ""
  annotations: {}
  tls: []
  host: ""
  # Routes marked stripPrefix must not pass their prefix to the backend
  # (livestream serves /events, not /livestream/events). An Ingress cannot say
  # that portably: with mode nginx the chart renders a second Ingress carrying
  # ingress-nginx's rewrite-target annotation; with mode none the prefix is
  # passed through unchanged and you have to strip it in your controller or
  # enable the bundled Caddy proxy, which honours stripPrefix directly. auto
  # picks nginx when ingress.className contains "nginx" and none otherwise.
  stripPrefix:
    mode: auto
    annotations:
      # Live events are server-sent events; buffering them defeats the point.
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"

routing:
  # OBJECT_STORAGE_PUBLIC_ENDPOINT defaults to the site URL, so browser-facing
  # object URLs are <siteUrl>/<bucket>/... and the bucket path has to reach the
  # bundled object store. Only rendered in bundled mode; in external mode set
  # external.objectStorage.publicEndpoint instead.
  objectStorageRoute:
    enabled: true
    # Empty means /<bucket> from internal.objectStorage.bucket. The minio
    # subchart's defaultBuckets below is a plain list and must name the same
    # bucket; Helm cannot template subchart values.
    path: ""
    host: "{{ include \"posthog.serviceHost\" (dict \"root\" . \"name\" \"objectStorage\") }}"
    port: 9000
  # Mirrors the upstream Caddy proxy in docker-compose.base.yml. More specific
  # paths come first for controllers that match in list order.
  routes:
    - path: /livestream
      service: livestream
      port: 8080
      stripPrefix: true
    - path: /i/v0/ai
      service: capture-ai
      port: 3000
    - path: /i/v0
      service: capture
      port: 3000
    - path: /i/v1/analytics/events
      service: capture
      port: 3000
    # Keep frontend assets on the Django web service. Some ingress
    # controllers treat /s as a raw string prefix and would otherwise route
    # /static to replay-capture.
    - path: /static
      service: web
      port: 8000
    - path: /s
      service: replay-capture
      port: 3000
    - path: /i/v1/logs
      service: capture-logs
      port: 4318
    - path: /i/v1/traces
      service: capture-logs
      port: 4318
    - path: /i/v1/metrics
      service: capture-logs
      port: 4318
    - path: /e
      service: capture
      port: 3000
    - path: /capture
      service: capture
      port: 3000
    - path: /batch
      service: capture
      port: 3000
    - path: /flags
      service: feature-flags
      port: 3001
    - path: /api/feature_flag/local_evaluation
      service: feature-flags
      port: 3001
    - path: /surveys
      service: hypercache-server
      port: 3002
    - path: /api/surveys
      service: hypercache-server
      port: 3002
    - path: /array
      service: hypercache-server
      port: 3002
    - path: /public/webhooks
      service: plugins
      port: 6738
    - path: /public/m
      service: plugins
      port: 6738
    - path: /
      service: web
      port: 8000

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Nothing in the chart talks to the Kubernetes API.
  automountToken: false

# Opt-in default-deny ingress for chart pods; see templates/networkpolicy.yaml.
networkPolicy:
  enabled: false
  ingress:
    # Namespaces allowed in besides the release namespace, e.g. the ingress
    # controller and Prometheus: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
    namespaceSelector: {}
    extraRules: []

# Applied when neither the component nor its image family sets one.
defaultPodSecurityContext:
  seccompProfile:
    type: RuntimeDefault
defaultSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# Requests only, so the scheduler can pack nodes and the HPA has a baseline;
# no limits, because the right ceiling depends on your traffic. Components
# below override where the default is clearly wrong for them.
defaultResources:
  requests:
    cpu: 100m
    memory: 256Mi

monitoring:
  serviceMonitor:
    enabled: false
    namespace: ""
    labels: {}
    annotations: {}
    interval: 30s
    scrapeTimeout: 10s
    metricRelabelings: []
    relabelings: []
    portNames:
      - metrics

components:
  web:
    enabled: true
    kind: Deployment
    image: app
    replicas: 1
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
    command: ["./bin/docker-server"]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
        add: ["SETGID", "SETUID"]
    ports:
      - name: http
        containerPort: 8000
        servicePort: 8000
      - name: metrics
        containerPort: 8001
        servicePort: 8001
    service:
      enabled: true
    env:
      LIVESTREAM_HOST: "{{ .Values.global.siteUrl }}/livestream"
      OTEL_SERVICE_NAME: posthog
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_SDK_DISABLED: "true"
      POSTHOG_SKIP_MIGRATION_CHECKS: "1"
      PERSONHOG_ADDR: "{{ include \"posthog.serviceAddress\" (dict \"root\" . \"name\" \"personhogRouter\" \"port\" 50052) }}"
      PERSONHOG_ENABLED: "true"
      PERSONHOG_ROLLOUT_PERCENTAGE: "100"
      RECORDING_API_URL: "{{ include \"posthog.serviceUrl\" (dict \"root\" . \"name\" \"recordingApi\" \"port\" 6738) }}"
      OPT_OUT_CAPTURE: "false"
    probes:
      liveness:
        httpGet:
          path: /_livez
          port: http
        periodSeconds: 10
        timeoutSeconds: 5
      readiness:
        httpGet:
          path: /_readyz?role=web
          port: http
        periodSeconds: 10
        timeoutSeconds: 5
      startup:
        httpGet:
          # Without a role /_readyz runs every check, including
          # postgres_migrations_uptodate, which cannot pass before the
          # post-install migrate job has run; the web role leaves it out.
          path: /_readyz?role=web
          port: http
        failureThreshold: 30
        periodSeconds: 10
  worker:
    enabled: true
    kind: Deployment
    image: app
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
    command: ["./bin/docker-worker-celery"]
    # RedBeat holds a distributed lock, so several workers with the scheduler
    # do not double-schedule; split the scheduler into its own single-replica
    # component when you scale workers, so scheduling does not roll with them.
    args: ["--with-scheduler"]
    # docker-worker-celery drains in-flight tasks on SIGTERM and expects a
    # long grace period (upstream runs with 1230s); the Kubernetes default of
    # 30s kills running tasks on every rollout.
    terminationGracePeriodSeconds: 1230
    env:
      API_QUERIES_PER_TEAM: '{"1": 100}'
      FLAGS_REDIS_ENABLED: "false"
      POSTHOG_SKIP_MIGRATION_CHECKS: "1"
      PERSONHOG_ADDR: "{{ include \"posthog.serviceAddress\" (dict \"root\" . \"name\" \"personhogRouter\" \"port\" 50052) }}"
      PERSONHOG_ENABLED: "true"
      PERSONHOG_ROLLOUT_PERCENTAGE: "100"
      RECORDING_API_URL: "{{ include \"posthog.serviceUrl\" (dict \"root\" . \"name\" \"recordingApi\" \"port\" 6738) }}"
      OTEL_SDK_DISABLED: "true"
  temporalDjangoWorker:
    enabled: true
    kind: Deployment
    image: app
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
    ports:
      - name: health
        containerPort: 8082
        servicePort: 8082
    env:
      # Upstream's worker health server (/healthz, /readyz); off unless a port is set.
      TEMPORAL_HEALTH_PORT: "8082"
    probes:
      readiness:
        httpGet:
          path: /readyz
          port: health
        initialDelaySeconds: 30
        periodSeconds: 15
        failureThreshold: 6
    command: ["./bin/temporal-django-worker"]
    # No --task-queue: serves general-purpose-task-queue.
  # Temporal workers. A worker serves exactly one task queue and, outside of
  # debug mode, every product has its own queue, so a single worker on the
  # general-purpose queue (temporalDjangoWorker above) leaves batch exports,
  # warehouse syncs, error tracking lifecycle and the rest without anyone to
  # run them. Each of these is a full Django process; disable the ones for
  # products you do not use to save memory.
  temporalWorkerBatchExports:
    # Batch exports to S3, BigQuery, Snowflake and the rest.
    enabled: true
    kind: Deployment
    image: app
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
    ports:
      - name: health
        containerPort: 8082
        servicePort: 8082
    env:
      # Upstream's worker health server (/healthz, /readyz); off unless a port is set.
      TEMPORAL_HEALTH_PORT: "8082"
    probes:
      readiness:
        httpGet:
          path: /readyz
          port: health
        initialDelaySeconds: 30
