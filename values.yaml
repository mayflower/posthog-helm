      TEMPORAL_CODEC_ENDPOINT: "{{ include \"posthog.serviceUrl\" (dict \"root\" . \"name\" \"web\" \"port\" 8000) }}"
  # General object storage: exports, symbol sets, AI blobs, warehouse tables.
  # SeaweedFS as in upstream's compose stack. Identities are registered at
  # runtime with s3.configure rather than a static -s3.config, which upstream
  # found to trigger SigV4 and presigned-URL regressions; no anonymous
  # identity is created, so only signed requests with the chart's object
  # storage credentials are accepted (the bucket path is routed through the
  # Ingress, and presigned URLs carry their own signature).
  objectStorage:
    enabled: true
    kind: StatefulSet
    image: seaweedfs
    replicas: 1
    command: ["/bin/sh", "-c"]
    args:
      - |
        BUCKETS="{{ join " " .Values.internal.objectStorage.buckets }}"
        (
          for attempt in $(seq 1 120); do
            sleep 5
            printf 's3.configure -access_key=%s -secret_key=%s -user=posthog -actions=Admin -apply\n' \
              "$OBJECT_STORAGE_ACCESS_KEY_ID" "$OBJECT_STORAGE_SECRET_ACCESS_KEY" \
              | /usr/bin/weed shell -master=localhost:9333 >/dev/null 2>&1 || true
            for b in $BUCKETS; do
              echo "s3.bucket.create -name $b" | /usr/bin/weed shell -master=localhost:9333 >/dev/null 2>&1 || true
            done
            LIST=$(echo "s3.bucket.list" | /usr/bin/weed shell -master=localhost:9333 2>/dev/null || true)
            IDS=$(echo "s3.configure" | /usr/bin/weed shell -master=localhost:9333 2>/dev/null || true)
            ok=1
            for b in $BUCKETS; do echo "$LIST" | grep -qF "$b" || ok=0; done
            echo "$IDS" | grep -qF "$OBJECT_STORAGE_ACCESS_KEY_ID" || ok=0
            if [ "$ok" = 1 ]; then
              echo "Object storage ready with buckets: $BUCKETS"
              exit 0
            fi
          done
          echo "Object storage bootstrap incomplete after 10 minutes" >&2
        ) &
        exec /usr/bin/weed server -s3 -s3.port=9000 -master.port=9333 -dir=/data
    ports:
      - name: s3
        containerPort: 9000
        servicePort: 9000
      - name: master
        containerPort: 9333
        servicePort: 9333
    service:
      enabled: true
    persistence:
      enabled: true
      size: 20Gi
      mountPath: /data
    probes:
      readiness:
        tcpSocket:
          port: s3
        periodSeconds: 10
  # Replay store. Upstream keeps it apart from general object storage and in
  # open-access mode; SESSION_RECORDING_V2_S3_* credentials are placeholders.
  seaweedfs:
    enabled: true
    kind: StatefulSet
    image: seaweedfs
    replicas: 1
    command: ["/bin/sh", "-c"]
    # The replay bucket does not create itself. A backgrounded, bounded loop
    # creates it once the master answers, while weed itself is exec'd as PID 1
    # so SIGTERM reaches it directly and a crash restarts the container.
    args:
      - |
        BUCKET="{{ include "posthog.sessionRecordingBucket" . }}"
        (
          for attempt in $(seq 1 120); do
            sleep 5
            if echo "s3.bucket.list" | /usr/bin/weed shell -master=localhost:9333 2>/dev/null | grep -qx "$BUCKET"; then
              echo "SeaweedFS ready with bucket $BUCKET"
              exit 0
            fi
            echo "s3.bucket.create -name $BUCKET" | /usr/bin/weed shell -master=localhost:9333 2>&1 || true
          done
          echo "SeaweedFS bucket $BUCKET still missing after 10 minutes" >&2
        ) &
        exec /usr/bin/weed server -s3 -s3.port=8333 -dir=/data
    ports:
      - name: s3
        containerPort: 8333
        servicePort: 8333
      - name: master
        containerPort: 9333
        servicePort: 9333
    service:
      enabled: true
    persistence:
      enabled: true
      size: 20Gi
      mountPath: /data
    probes:
      readiness:
        tcpSocket:
          port: s3
        periodSeconds: 10
  # Headless Chromium. The PostHog image ships no browser, and image exports
  # raise without BROWSERLESS_CDP_URL: dashboard and insight exports,
  # subscriptions, heatmap and event screenshots all render here. commonEnv
  # points every Django process at it while this is enabled.
  browserless:
    enabled: true
    kind: Deployment
    image: browserless
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
    ports:
      - name: http
        containerPort: 3000
        servicePort: 3000
    service:
      enabled: true
    env:
      # Bounded so a stuck export cannot pin the browser forever.
      TIMEOUT: "180000"
      MAX_CONCURRENT_SESSIONS: "5"
    extraEnv:
      - name: TOKEN
        valueFrom:
          secretKeyRef:
            name: "{{ include \"posthog.secretName\" . }}"
            key: "{{ .Values.secrets.keys.browserlessToken }}"
    probes:
      readiness:
        tcpSocket:
          port: http
        periodSeconds: 10
      liveness:
        tcpSocket:
          port: http
        periodSeconds: 20
  # Bundled Postgres. Single primary, no replication; run a managed Postgres
  # or an operator for anything beyond evaluation. PGDATA sits one level below
  # the mount so the volume's lost+found does not break initdb.
  postgres:
    enabled: true
    kind: StatefulSet
    image: postgres
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
    ports:
      - name: postgres
        containerPort: 5432
        servicePort: 5432
    service:
      enabled: true
    env:
      POSTGRES_USER: "{{ .Values.internal.postgres.user }}"
      POSTGRES_PASSWORD: "{{ .Values.internal.postgres.password }}"
      POSTGRES_DB: "{{ .Values.internal.postgres.database }}"
      PGDATA: /var/lib/postgresql/data/pgdata
    configMounts:
      - name: posthog-postgres-init
        mountPath: /docker-entrypoint-initdb.d
    persistence:
      enabled: true
      size: 20Gi
      mountPath: /var/lib/postgresql/data
    probes:
      readiness:
        exec:
          command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
        periodSeconds: 10
      liveness:
        exec:
          command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
        initialDelaySeconds: 30
        periodSeconds: 20
  # ZooKeeper for the bundled ClickHouse. Official image; both data
  # directories live on the one claim.
  zookeeper:
    enabled: true
    kind: StatefulSet
    image: zookeeper
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
    ports:
      - name: client
        containerPort: 2181
        servicePort: 2181
    service:
      enabled: true
    env:
      ZOO_MY_ID: "1"
      ZOO_DATA_DIR: /data/data
      ZOO_DATA_LOG_DIR: /data/datalog
      ZOO_4LW_COMMANDS_WHITELIST: srvr,mntr,ruok
      ZOO_AUTOPURGE_PURGEINTERVAL: "1"
    persistence:
      enabled: true
      size: 10Gi
      mountPath: /data
    probes:
      readiness:
        exec:
          command: ["sh", "-c", "echo ruok | nc -w 2 localhost 2181 | grep -q imok"]
        periodSeconds: 10
      liveness:
        tcpSocket:
          port: client
        initialDelaySeconds: 30
        periodSeconds: 20
  # Main Redis-compatible store: Django cache, Celery broker and RedBeat
  # schedule, flags, session recording state. Same memory settings as
  # upstream's redis7 container; raise --maxmemory before scaling out.
  valkey:
    enabled: true
    kind: StatefulSet
    image: valkey
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
    args:
      - valkey-server
      - --maxmemory-policy
      - allkeys-lru
      - --maxmemory
      - 200mb
      - --dir
      - /data
      - --save
      - "60 1"
    ports:
      - name: redis
        containerPort: 6379
        servicePort: 6379
    service:
      enabled: true
    persistence:
      enabled: true
      size: 8Gi
      mountPath: /data
    probes:
      readiness:
        exec:
          command: ["valkey-cli", "ping"]
        periodSeconds: 5
      liveness:
        tcpSocket:
          port: redis
        periodSeconds: 10
  # CDP shadow store. Disposable by design: no volume, evicted under the cap,
  # same settings as upstream's valkey container.
  valkeyShadow:
    enabled: true
    kind: Deployment
    image: valkey
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
    args:
      - valkey-server
      - --maxmemory-policy
      - allkeys-lru
      - --maxmemory
      - 200mb
    ports:
      - name: redis
        containerPort: 6379
        servicePort: 6379
    service:
      enabled: true
    probes:
      readiness:
        exec:
          command: ["valkey-cli", "ping"]
        periodSeconds: 5
      liveness:
        tcpSocket:
          port: redis
        periodSeconds: 10
  elasticsearch:
    enabled: false
    kind: StatefulSet
    image: elasticsearch
    replicas: 1
    args:
      - -Ediscovery.type=single-node
      - -Expack.security.enabled=false
    ports:
      - name: http
        containerPort: 9200
        servicePort: 9200
    service:
      enabled: true
    env:
      ES_JAVA_OPTS: -Xms256m -Xmx256m
    persistence:
      enabled: true
      size: 20Gi
      mountPath: /usr/share/elasticsearch/data
  opensearch:
    enabled: false
    kind: StatefulSet
    image: opensearch
    replicas: 1
    args:
      - -Ecluster.name=opensearch-cluster
      - -Enode.name=opensearch-node-1
      - -Ediscovery.type=single-node
    ports:
      - name: http
        containerPort: 9200
        servicePort: 9200
    service:
      enabled: true
    env:
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    persistence:
      enabled: true
      size: 20Gi
      mountPath: /usr/share/opensearch/data
  opensearchDashboards:
    enabled: false
    kind: Deployment
    image: opensearchDashboards
    replicas: 1
    ports:
      - name: http
        containerPort: 5601
        servicePort: 5601
    service:
      enabled: true
    env:
      OPENSEARCH_HOSTS: "{{ include \"posthog.opensearchUrl\" . }}"
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
  flower:
    enabled: false
    kind: Deployment
    image: flower
    replicas: 1
    ports:
      - name: http
        containerPort: 5555
        servicePort: 5555
    service:
      enabled: true
    env:
      FLOWER_PORT: "5555"
      CELERY_BROKER_URL: "{{ include \"posthog.redisUrl\" . }}"
  kafkaUi:
    enabled: false
    kind: Deployment
    image: kafkaUi
    replicas: 1
    ports:
      - name: http
        containerPort: 8080
        servicePort: 8080
    service:
      enabled: true
    env:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "{{ include \"posthog.kafkaHosts\" . }}"
      DYNAMIC_CONFIG_ENABLED: "true"
  maildev:
    enabled: false
    kind: Deployment
    image: maildev
    replicas: 1
    ports:
      - name: http
        containerPort: 1080
        servicePort: 1080
      - name: smtp
        containerPort: 1025
        servicePort: 1025
    service:
      enabled: true
  objectstorageAzure:
    enabled: false
    kind: StatefulSet
    image: azurite
    replicas: 1
    command: ["azurite-blob"]
    args: ["--blobHost", "0.0.0.0", "--blobPort", "10000", "--location", "/data"]
    ports:
      - name: blob
        containerPort: 10000
        servicePort: 10000
    service:
      enabled: true
    persistence:
      enabled: true
      size: 10Gi
      mountPath: /data
  webhookTester:
    enabled: false
    kind: Deployment
    image: webhookTester
    replicas: 1
    ports:
      - name: http
        containerPort: 8080
        servicePort: 8080
    service:
      enabled: true
    env:
      AUTO_CREATE_SESSIONS: "true"
      OTEL_SDK_DISABLED: "true"
  otelCollector:
    enabled: false
    kind: Deployment
    image: otelCollector
    replicas: 1
    args: ["--config=/etc/otel-collector-config.yaml"]
  jaeger:
    enabled: false
    kind: Deployment
    image: jaeger
    replicas: 1
  localstack:
    enabled: false
    kind: StatefulSet
    image: localstack
    replicas: 1
    env:
      DEBUG: "0"
    persistence:
      enabled: true
      size: 10Gi
      mountPath: /var/lib/localstack
  duckgres:
    enabled: false
    kind: StatefulSet
    image: duckgres
    replicas: 1
    args: ["--config", "/app/config.yaml"]
    persistence:
      enabled: true
      size: 10Gi
      mountPath: /app/data
  etcd:
    enabled: false
    kind: StatefulSet
    image: etcd
    replicas: 1
    ports:
      - name: client
        containerPort: 2379
        servicePort: 2379
    service:
      enabled: true
    command: ["/usr/local/bin/etcd"]
    args:
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    persistence:
      enabled: true
      size: 10Gi
      mountPath: /etcd-data

clickhouse:
  enabled: true
  operator:
    enabled: true
  clusterName: posthog
  image: clickhouse/clickhouse-server:26.3.9.8
  replicas: 1
  storage: 50Gi
  satelliteClusters: ""
  # ClickHouse's default is debug, with console_log_level at trace. That is a
  # debugging setting, not a production one -- see the note in the template.
  logLevel: warning

  # ClickHouse's own diagnostic tables. Left unconfigured they write
  # continuously on an idle deployment and never expire -- 66.9 GiB against
  # 3.6 GiB of real data when this was measured. Set trim to false to keep the
  # ClickHouse defaults.
  systemLogs:
    trim: true
    # Removed entirely: profiling and duplicated data.
    disabled:
      - text_log                      # repeats the server log on stdout
      - trace_log                     # profiling only
      - processors_profile_log        # profiling only
      - query_views_log               # per-view detail, rarely read
      - background_schedule_pool_log  # internal scheduler churn
      - metric_log                    # Prometheus already scrapes these
      - asynchronous_metric_log       # 16 billion rows when measured
      - opentelemetry_span_log
      - zookeeper_log

  # Every Kafka-engine table names one of these; a missing one stops the
  # migrate job with "There is no named collection". This is the set in
  # upstream's docker/clickhouse/config.d/default.xml; diff against it after
  # image bumps. All point at the same broker here.
  namedCollections:
    - msk_cluster
    - warpstream_ingestion
    - warpstream_calculated_events
    - warpstream_replay
    - warpstream_shared
    - warpstream_cyclotron
    - warpstream_logs
    - warpstream_traces
    - warpstream_metrics
  macros:
    hostClusterType: online
    hostClusterRole: data
  config:
    kafkaHosts: "{{ include \"posthog.kafkaHosts\" . }}"

redpanda:
  fullnameOverride: kafka
  config:
    cluster:
      enable_metrics_reporter: false
  logging:
    usageStats:
      enabled: false
  external:
    enabled: false
    service:
      enabled: false
  console:
    enabled: false
  post_install_job:
    annotations:
      argocd.argoproj.io/hook-delete-policy: HookSucceeded
      helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  statefulset:
    replicas: 1
  tls:
    enabled: false
  listeners:
    kafka:
      port: 9092
  resources:
    cpu:
      cores: 1
    memory:
      container:
        max: 3Gi
  storage:
    persistentVolume:
      enabled: true
      size: 20Gi

# The operator's CRD hook shells out to kubectl; the subchart defaults to a
# floating bitnami/kubectl:latest. alpine/k8s ships kubectl with a shell.
altinity-clickhouse-operator:
  crdHook:
    image:
      repository: alpine/k8s
      tag: 1.33.4
