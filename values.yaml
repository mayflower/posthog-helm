    tag: master
  node:
    repository: ghcr.io/posthog/posthog-node
    tag: master
  capture:
    repository: ghcr.io/posthog/posthog/capture
    tag: master
  captureLogs:
    repository: ghcr.io/posthog/posthog/capture-logs
    tag: master
  propertyDefs:
    repository: ghcr.io/posthog/posthog/property-defs-rs
    tag: master
  featureFlags:
    repository: ghcr.io/posthog/posthog/feature-flags
    tag: master
  personhogReplica:
    repository: ghcr.io/posthog/posthog/personhog-replica
    tag: master
  personhogRouter:
    repository: ghcr.io/posthog/posthog/personhog-router
    tag: master
  hypercache:
    repository: ghcr.io/posthog/posthog/hypercache-server
    tag: master
  livestream:
    repository: ghcr.io/posthog/posthog/livestream
    tag: master
  cyclotronJanitor:
    repository: ghcr.io/posthog/posthog/cyclotron-janitor
    tag: master
  cymbal:
    repository: ghcr.io/posthog/posthog/cymbal
    tag: master
  redpandaTools:
    repository: docker.redpanda.com/redpandadata/redpanda
    tag: v25.1.9
  caddy:
    repository: caddy
    tag: "2.10.2"
  maildev:
    repository: maildev/maildev
    tag: 2.0.5
  flower:
    repository: mher/flower
    tag: 2.0.0
  kafkaUi:
    repository: provectuslabs/kafka-ui
    tag: v0.7.2
  temporal:
    repository: temporalio/auto-setup
    tag: 1.26.2
  temporalAdminTools:
    repository: temporalio/admin-tools
    tag: 1.26.2
  temporalUi:
    repository: temporalio/ui
    tag: 2.47.2
  elasticsearch:
    repository: elasticsearch
    tag: 7.17.28
  opensearch:
    repository: opensearchproject/opensearch
    tag: 2.13.0
  opensearchDashboards:
    repository: opensearchproject/opensearch-dashboards
    tag: 2.13.0
  azurite:
    repository: mcr.microsoft.com/azure-storage/azurite
    tag: 3.35.0
  webhookTester:
    repository: tarampampam/webhook-tester
    tag: 2.2.6
  otelCollector:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.142.0
  jaeger:
    repository: jaegertracing/all-in-one
    tag: 1.76.0
  localstack:
    repository: localstack/localstack
    tag: 4.12.0
  seaweedfs:
    repository: chrislusf/seaweedfs
    tag: "4.03"
  duckgres:
    repository: ghcr.io/posthog/duckgres
    tag: 5cfca88a52f366765fcdb122056e7ad3f038ec4f
  etcd:
    repository: quay.io/coreos/etcd
    tag: v3.6.8

external:
  postgres:
    url: ""
    host: ""
    port: 5432
    database: posthog
    user: posthog
    sslMode: ""
    params: {}
    passwordSecret:
      name: ""
      key: password
  redis:
    url: ""
    host: ""
    port: 6379
    database: 0
    tls: false
    passwordSecret:
      name: ""
      key: password
  kafka:
    hosts: ""
  clickhouse:
    host: ""
    database: posthog
    user: app
    secure: "false"
    verify: "false"
    cluster: ""
    migrationsCluster: ""
    passwordSecret:
      name: ""
      key: password
  objectStorage:
    endpoint: ""
    publicEndpoint: ""
    bucket: posthog
    region: us-east-1
    accessKeySecret:
      name: ""
      key: access-key
    secretKeySecret:
      name: ""
      key: secret-key
  sessionRecording:
    endpoint: ""
    accessKeySecret:
      name: ""
      key: access-key
    secretKeySecret:
      name: ""
      key: secret-key
  temporal:
    host: ""
    port: 7233
  opensearch:
    host: ""

internal:
  postgres:
    host: db
    port: 5432
    database: posthog
    user: posthog
    password: posthog
  redis:
    host: redis7-master
    port: 6379
    database: 0
    tls: false
  kafka:
    hosts: kafka:9092
  clickhouse:
    host: clickhouse
    database: posthog
    user: app
    secure: "false"
    verify: "false"
    cluster: posthog
    migrationsCluster: ""
  objectStorage:
    endpoint: http://objectstorage:9000
    publicEndpoint: ""
    bucket: posthog
    region: us-east-1
  sessionRecording:
    endpoint: http://seaweedfs:8333
    accessKey: any
    secretKey: any
  temporal:
    host: "{{ include \"posthog.serviceHost\" (dict \"root\" . \"name\" \"temporal\") }}"
    port: 7233
  opensearch:
    host: "{{ include \"posthog.serviceHost\" (dict \"root\" . \"name\" \"opensearch\") }}:9200"

ingress:
  enabled: true
  className: ""
  annotations: {}
  tls: []
  host: ""

routing:
  routes:
    - path: /livestream
      service: livestream
      port: 8080
      stripPrefix: true
    - path: /i/v0/ai
      service: capture-ai
      port: 3000
    - path: /s
      service: replay-capture
      port: 3000
    - path: /i/v1/logs
      service: capture-logs
      port: 4318
    - path: /i/v1/traces
      service: capture-logs
      port: 4318
    - path: /e
      service: capture
      port: 3000
    - path: /capture
      service: capture
      port: 3000
    - path: /batch
      service: capture
      port: 3000
    - path: /flags
      service: feature-flags
      port: 3001
    - path: /surveys
      service: hypercache-server
      port: 3002
    - path: /api/surveys
      service: hypercache-server
      port: 3002
    - path: /array
      service: hypercache-server
      port: 3002
    - path: /public/webhooks
      service: plugins
      port: 6738
    - path: /public/m
      service: plugins
      port: 6738
    - path: /
      service: web
      port: 8000

serviceAccount:
  create: true
  name: ""
  annotations: {}

defaultPodSecurityContext: {}
defaultSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

defaultResources: {}

monitoring:
  serviceMonitor:
    enabled: false
    namespace: ""
    labels: {}
    annotations: {}
    interval: 30s
    scrapeTimeout: 10s
    metricRelabelings: []
    relabelings: []
    portNames:
      - metrics

components:
  web:
    enabled: true
    kind: Deployment
    image: app
    replicas: 1
    command: ["./bin/docker-server"]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
        add: ["SETGID", "SETUID"]
    ports:
      - name: http
        containerPort: 8000
        servicePort: 8000
      - name: metrics
        containerPort: 8001
        servicePort: 8001
    service:
      enabled: true
    env:
      LIVESTREAM_HOST: "{{ .Values.global.siteUrl }}/livestream"
      OTEL_SERVICE_NAME: posthog
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_SDK_DISABLED: "true"
      POSTHOG_SKIP_MIGRATION_CHECKS: "1"
      PERSONHOG_ADDR: "{{ include \"posthog.serviceUrl\" (dict \"root\" . \"name\" \"personhogRouter\" \"port\" 50052) }}"
      PERSONHOG_ENABLED: "true"
      PERSONHOG_ROLLOUT_PERCENTAGE: "100"
      RECORDING_API_URL: "{{ include \"posthog.serviceUrl\" (dict \"root\" . \"name\" \"recordingApi\" \"port\" 6738) }}"
      OPT_OUT_CAPTURE: "false"
    probes:
      liveness:
        httpGet:
          path: /_livez
          port: http
        periodSeconds: 10
        timeoutSeconds: 5
      readiness:
        httpGet:
          path: /_readyz?role=web
          port: http
        periodSeconds: 10
        timeoutSeconds: 5
      startup:
        httpGet:
          path: /_readyz
          port: http
        failureThreshold: 30
        periodSeconds: 10
  worker:
    enabled: true
    kind: Deployment
    image: app
    replicas: 1
    command: ["./bin/docker-worker-celery"]
    args: ["--with-scheduler"]
    env:
      API_QUERIES_PER_TEAM: '{"1": 100}'
      CDP_API_URL: "{{ include \"posthog.serviceUrl\" (dict \"root\" . \"name\" \"plugins\" \"port\" 6738) }}"
      FLAGS_REDIS_ENABLED: "false"
      POSTHOG_SKIP_MIGRATION_CHECKS: "1"
      PERSONHOG_ADDR: "{{ include \"posthog.serviceUrl\" (dict \"root\" . \"name\" \"personhogRouter\" \"port\" 50052) }}"
      PERSONHOG_ENABLED: "true"
      PERSONHOG_ROLLOUT_PERCENTAGE: "100"
      RECORDING_API_URL: "{{ include \"posthog.serviceUrl\" (dict \"root\" . \"name\" \"recordingApi\" \"port\" 6738) }}"
      OTEL_SDK_DISABLED: "true"
  temporalDjangoWorker:
    enabled: true
    kind: Deployment
    image: app
    replicas: 1
    command: ["./bin/temporal-django-worker"]
  plugins:
    enabled: true
    kind: Deployment
    image: node
    replicas: 1
    command: ["node", "nodejs/dist/index.js"]
    ports:
      - name: http
        containerPort: 6738
        servicePort: 6738
    service:
      enabled: true
    env:
      CDP_REDIS_HOST: "{{ include \"posthog.redisHost\" . }}"
      CDP_REDIS_PORT: "{{ include \"posthog.redisPort\" . }}"
      CYCLOTRON_DATABASE_URL: "{{ include \"posthog.postgresUrl\" . }}"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    probes:
      readiness:
        httpGet:
          path: /_ready
          port: http
        initialDelaySeconds: 15
        periodSeconds: 10
  ingestionGeneral:
    enabled: true
    kind: Deployment
    image: node
    replicas: 1
    command: ["node", "nodejs/dist/index.js"]
    env:
      PLUGIN_SERVER_MODE: ingestion-v2-combined
      CDP_REDIS_HOST: "{{ include \"posthog.redisHost\" . }}"
  ingestionSessionReplay:
    enabled: true
    kind: Deployment
    image: node
    replicas: 1
    command: ["node", "nodejs/dist/index.js"]
    env:
      PLUGIN_SERVER_MODE: recordings-blob-ingestion-v2
      SESSION_RECORDING_V2_S3_TIMEOUT_MS: "120000"
  recordingApi:
    enabled: true
    kind: Deployment
    image: node
    replicas: 1
    command: ["node", "nodejs/dist/index.js"]
    ports:
      - name: http
        containerPort: 6738
        servicePort: 6738
    service:
      enabled: true
    env:
      PLUGIN_SERVER_MODE: recording-api
      SESSION_RECORDING_API_REDIS_HOST: "{{ include \"posthog.redisUrl\" . }}"
      SESSION_RECORDING_API_REDIS_PORT: "{{ include \"posthog.redisPort\" . }}"
  ingestionErrorTracking:
    enabled: true
    kind: Deployment
    image: node
    replicas: 1
    command: ["node", "nodejs/dist/index.js"]
    env:
      PLUGIN_SERVER_MODE: ingestion-errortracking
      CDP_REDIS_HOST: "{{ include \"posthog.redisHost\" . }}"
  ingestionLogs:
    enabled: true
    kind: Deployment
    image: node
    replicas: 1
    command: ["node", "nodejs/dist/index.js"]
    env:
      PLUGIN_SERVER_MODE: ingestion-logs
      LOGS_REDIS_HOST: "{{ include \"posthog.redisUrl\" . }}"
      LOGS_REDIS_PORT: "{{ include \"posthog.redisPort\" . }}"
      LOGS_REDIS_TLS: "{{ include \"posthog.redisTls\" . }}"
  ingestionTraces:
    enabled: true
    kind: Deployment
    image: node
    replicas: 1
    command: ["node", "nodejs/dist/index.js"]
    env:
      PLUGIN_SERVER_MODE: ingestion-traces
      TRACES_REDIS_HOST: "{{ include \"posthog.redisUrl\" . }}"
      TRACES_REDIS_PORT: "{{ include \"posthog.redisPort\" . }}"
      TRACES_REDIS_TLS: "{{ include \"posthog.redisTls\" . }}"
  capture:
    enabled: true
    kind: Deployment
    image: capture
    replicas: 1
    ports:
      - name: http
        containerPort: 3000
        servicePort: 3000
    service:
      enabled: true
    env:
      ADDRESS: 0.0.0.0:3000
      KAFKA_TOPIC: events_plugin_ingestion
      CAPTURE_MODE: events
      RUST_LOG: info,rdkafka=warn
    probes:
      liveness:
        httpGet:
          path: /_liveness
          port: http
        periodSeconds: 10
  replayCapture:
    enabled: true
    kind: Deployment
    image: capture
    replicas: 1
    ports:
      - name: http
        containerPort: 3000
        servicePort: 3000
    service:
      enabled: true
    env:
      ADDRESS: 0.0.0.0:3000
      KAFKA_TOPIC: session_recording_snapshot_item_events
      CAPTURE_MODE: recordings
  captureAi:
    enabled: true
    kind: Deployment
    image: capture
    replicas: 1
    ports:
      - name: http
        containerPort: 3000
        servicePort: 3000
    service:
      enabled: true
    env:
      ADDRESS: 0.0.0.0:3000
      KAFKA_TOPIC: events_plugin_ingestion
      CAPTURE_MODE: events
      RUST_LOG: info,rdkafka=warn
      AI_S3_BUCKET: ai-blobs
      AI_S3_PREFIX: llma/
      AI_S3_ENDPOINT: "{{ include \"posthog.objectStorageEndpoint\" . }}"
      AI_S3_REGION: "{{ include \"posthog.objectStorageRegion\" . }}"
  captureLogs:
    enabled: true
    kind: Deployment
    image: captureLogs
    replicas: 1
    ports:
      - name: otlp
        containerPort: 4318
        servicePort: 4318
    service:
      enabled: true
    env:
      BIND_HOST: 0.0.0.0
      BIND_PORT: "4318"
      RUST_LOG: info,rdkafka=warn
      RUST_BACKTRACE: "1"
      KAFKA_TOPIC: logs_ingestion
  propertyDefs:
    enabled: true
    kind: Deployment
    image: propertyDefs
    replicas: 1
    env:
      SKIP_WRITES: "false"
      SKIP_READS: "false"
      FILTER_MODE: opt-out
  featureFlags:
    enabled: true
    kind: Deployment
    image: featureFlags
    replicas: 1
    ports:
      - name: http
        containerPort: 3001
        servicePort: 3001
    service:
      enabled: true
    env:
      ADDRESS: 0.0.0.0:3001
      RUST_LOG: info
      MAXMIND_DB_PATH: /app/share/GeoLite2-City.mmdb
      COOKIELESS_REDIS_HOST: "{{ include \"posthog.redisHost\" . }}"
      COOKIELESS_REDIS_PORT: "{{ include \"posthog.redisPort\" . }}"
    probes:
      readiness:
        httpGet:
          path: /_readiness
          port: http
        periodSeconds: 10
  hypercacheServer:
    enabled: true
    kind: Deployment
    image: hypercache
    replicas: 1
    ports:
      - name: http
        containerPort: 3002
        servicePort: 3002
    service:
      enabled: true
    env:
      ADDRESS: 0.0.0.0:3002
      RUST_LOG: info
    probes:
      readiness:
        httpGet:
          path: /_readiness
          port: http
        periodSeconds: 10
  personhogReplica:
    enabled: true
    kind: Deployment
    image: personhogReplica
    replicas: 1
    ports:
      - name: grpc
        containerPort: 50051
        servicePort: 50051
      - name: metrics
        containerPort: 9100
        servicePort: 9100
    service:
      enabled: true
    env:
      GRPC_ADDRESS: 0.0.0.0:50051
      PRIMARY_DATABASE_URL: "{{ include \"posthog.postgresUrl\" . }}"
      RUST_LOG: info
      METRICS_PORT: "9100"
  personhogRouter:
    enabled: true
    kind: Deployment
    image: personhogRouter
    replicas: 1
    ports:
      - name: grpc
        containerPort: 50052
        servicePort: 50052
      - name: metrics
        containerPort: 9101
        servicePort: 9101
    service:
      enabled: true
    env:
      GRPC_ADDRESS: 0.0.0.0:50052
      REPLICA_URL: "{{ include \"posthog.serviceUrl\" (dict \"root\" . \"name\" \"personhogReplica\" \"port\" 50051) }}"
      BACKEND_TIMEOUT_MS: "5000"
      RUST_LOG: info
      METRICS_PORT: "9101"
  livestream:
    enabled: true
    kind: Deployment
    image: livestream
    replicas: 1
    ports:
      - name: http
        containerPort: 8080
        servicePort: 8080
    service:
      enabled: true
    env:
      LIVESTREAM_DEBUG: "false"
      LIVESTREAM_MMDB_PATH: /GeoLite2-City.mmdb
      LIVESTREAM_POSTGRES_URL: "{{ include \"posthog.postgresUrl\" . }}"
      LIVESTREAM_REDIS_ADDRESS: "{{ include \"posthog.redisHost\" . }}"
      LIVESTREAM_REDIS_PORT: "{{ include \"posthog.redisPort\" . }}"
      LIVESTREAM_REDIS_TLS: "false"
      LIVESTREAM_REDIS_USE_PUB_SUB: "true"
      LIVESTREAM_CONSUMERS_EVENT_ENABLED: "true"
      LIVESTREAM_CONSUMERS_EVENT_BROKERS: "{{ include \"posthog.kafkaHosts\" . }}"
      LIVESTREAM_CONSUMERS_EVENT_TOPIC: events_plugin_ingestion
      LIVESTREAM_CONSUMERS_EVENT_SECURITY_PROTOCOL: PLAINTEXT
      LIVESTREAM_CONSUMERS_EVENT_GROUP_ID: livestream
      LIVESTREAM_CONSUMERS_EVENT_SESSION_TIMEOUT_MS: "6000"
      LIVESTREAM_CONSUMERS_EVENT_HEARTBEAT_INTERVAL_MS: "1000"
      LIVESTREAM_CONSUMERS_EVENT_MAX_POLL_INTERVAL_MS: "6000"
      LIVESTREAM_CONSUMERS_SESSION_RECORDING_ENABLED: "true"
      LIVESTREAM_CONSUMERS_SESSION_RECORDING_BROKERS: "{{ include \"posthog.kafkaHosts\" . }}"
      LIVESTREAM_CONSUMERS_SESSION_RECORDING_TOPIC: session_recording_snapshot_item_events
      LIVESTREAM_CONSUMERS_SESSION_RECORDING_SECURITY_PROTOCOL: PLAINTEXT
      LIVESTREAM_CONSUMERS_SESSION_RECORDING_GROUP_ID: livestream-session-recordings
      LIVESTREAM_CONSUMERS_NOTIFICATION_ENABLED: "false"
  cyclotronJanitor:
    enabled: true
    kind: Deployment
    image: cyclotronJanitor
    replicas: 1
    env:
      KAFKA_TOPIC: clickhouse_app_metrics2
  cymbal:
    enabled: true
    kind: Deployment
    image: cymbal
    replicas: 1
    ports:
      - name: http
        containerPort: 3302
        servicePort: 3302
    service:
      enabled: true
    env:
      OBJECT_STORAGE_BUCKET: posthog
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      BIND_HOST: 0.0.0.0
      BIND_PORT: "3302"
      PERSONS_URL: "{{ include \"posthog.postgresUrl\" . }}"
      MAXMIND_DB_PATH: /app/share/GeoLite2-City.mmdb
      ISSUE_BUCKETS_REDIS_URL: "{{ include \"posthog.redisUrl\" . }}"
      RUST_LOG: info
  migrate:
    enabled: true
    kind: Job
    image: app
    hook: pre-install,pre-upgrade
    command: ["./bin/migrate"]
  asyncMigrationsCheck:
    enabled: true
    kind: Job
    image: app
    hook: post-install,post-upgrade
    command: ["python", "manage.py", "run_async_migrations", "--check"]
    env:
      SKIP_ASYNC_MIGRATIONS_SETUP: "0"
  kafkaInit:
    enabled: true
    kind: Job
    image: redpandaTools
    hook: pre-install,pre-upgrade
    command: ["/bin/sh", "-c"]
    args:
      - |
        set -e
        until rpk topic list --brokers "${KAFKA_HOSTS}"; do sleep 2; done
        topics="{{ range .Values.kafka.topics }} {{ . }}{{ end }}"
        for topic in $topics; do
          if rpk topic create "$topic" --brokers "${KAFKA_HOSTS}" -p {{ .Values.kafka.defaultPartitions }} -r {{ .Values.kafka.defaultReplicationFactor }}; then
            echo "Created Kafka topic $topic"
          elif rpk topic list --brokers "${KAFKA_HOSTS}" | awk '{print $1}' | grep -Fxq "$topic"; then
            echo "Kafka topic $topic already exists"
          else
            echo "Failed to create Kafka topic $topic"
            exit 1
          fi
        done
  proxy:
    enabled: false
    kind: Deployment
    image: caddy
    replicas: 1
    command: ["sh", "-c"]
    args: ["caddy run --config /etc/caddy/Caddyfile"]
    ports:
      - name: http
        containerPort: 80
        servicePort: 80
      - name: https
        containerPort: 443
        servicePort: 443
    service:
      enabled: true
    configMounts:
      - name: posthog-proxy
        mountPath: /etc/caddy
  temporal:
    enabled: true
    kind: Deployment
    image: temporal
    replicas: 1
    ports:
      - name: grpc
        containerPort: 7233
        servicePort: 7233
    service:
      enabled: true
    configMounts:
      - name: posthog-temporal-dynamicconfig
        mountPath: /etc/temporal/config/dynamicconfig
    env:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: posthog
      POSTGRES_SEEDS: "{{ include \"posthog.postgresHost\" . }}"
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      ENABLE_ES: "false"
  temporalAdminTools:
    enabled: false
    kind: Deployment
    image: temporalAdminTools
    replicas: 1
    env:
      TEMPORAL_CLI_ADDRESS: "{{ include \"posthog.temporalAddress\" . }}"
  temporalUi:
    enabled: false
    kind: Deployment
    image: temporalUi
    replicas: 1
    ports:
      - name: http
        containerPort: 8080
        servicePort: 8080
    service:
      enabled: true
    env:
      TEMPORAL_ADDRESS: "{{ include \"posthog.temporalAddress\" . }}"
      TEMPORAL_CORS_ORIGINS: "{{ .Values.global.siteUrl }}"
      TEMPORAL_CSRF_COOKIE_INSECURE: "true"
      TEMPORAL_CODEC_ENDPOINT: "{{ include \"posthog.serviceUrl\" (dict \"root\" . \"name\" \"web\" \"port\" 8000) }}"
  seaweedfs:
    enabled: true
    kind: StatefulSet
    image: seaweedfs
    replicas: 1
    command: ["/bin/sh", "-c"]
    args:
      - |
        /usr/bin/weed server -s3 -s3.port=8333 -dir=/data
    ports:
      - name: s3
        containerPort: 8333
        servicePort: 8333
      - name: master
        containerPort: 9333
        servicePort: 9333
    service:
      enabled: true
    persistence:
      enabled: true
      size: 20Gi
      mountPath: /data
  elasticsearch:
    enabled: false
    kind: StatefulSet
    image: elasticsearch
    replicas: 1
    args:
      - -Ediscovery.type=single-node
      - -Expack.security.enabled=false
    ports:
      - name: http
        containerPort: 9200
        servicePort: 9200
    service:
      enabled: true
    env:
      ES_JAVA_OPTS: -Xms256m -Xmx256m
    persistence:
      enabled: true
      size: 20Gi
      mountPath: /usr/share/elasticsearch/data
  opensearch:
    enabled: false
    kind: StatefulSet
    image: opensearch
    replicas: 1
    args:
      - -Ecluster.name=opensearch-cluster
      - -Enode.name=opensearch-node-1
      - -Ediscovery.type=single-node
    ports:
      - name: http
        containerPort: 9200
        servicePort: 9200
    service:
      enabled: true
    env:
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    persistence:
      enabled: true
      size: 20Gi
      mountPath: /usr/share/opensearch/data
  opensearchDashboards:
    enabled: false
    kind: Deployment
    image: opensearchDashboards
    replicas: 1
    ports:
      - name: http
        containerPort: 5601
        servicePort: 5601
    service:
      enabled: true
    env:
      OPENSEARCH_HOSTS: "{{ include \"posthog.opensearchUrl\" . }}"
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
  flower:
    enabled: false
    kind: Deployment
    image: flower
    replicas: 1
    ports:
      - name: http
        containerPort: 5555
        servicePort: 5555
    service:
      enabled: true
    env:
      FLOWER_PORT: "5555"
      CELERY_BROKER_URL: "{{ include \"posthog.redisUrl\" . }}"
  kafkaUi:
    enabled: false
    kind: Deployment
    image: kafkaUi
    replicas: 1
    ports:
      - name: http
        containerPort: 8080
        servicePort: 8080
    service:
      enabled: true
    env:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "{{ include \"posthog.kafkaHosts\" . }}"
      DYNAMIC_CONFIG_ENABLED: "true"
  maildev:
    enabled: false
    kind: Deployment
    image: maildev
    replicas: 1
    ports:
      - name: http
        containerPort: 1080
        servicePort: 1080
      - name: smtp
        containerPort: 1025
        servicePort: 1025
    service:
      enabled: true
  objectstorageAzure:
    enabled: false
    kind: StatefulSet
    image: azurite
    replicas: 1
    command: ["azurite-blob"]
    args: ["--blobHost", "0.0.0.0", "--blobPort", "10000", "--location", "/data"]
    ports:
      - name: blob
        containerPort: 10000
        servicePort: 10000
    service:
      enabled: true
    persistence:
      enabled: true
      size: 10Gi
      mountPath: /data
  webhookTester:
    enabled: false
    kind: Deployment
    image: webhookTester
    replicas: 1
    ports:
      - name: http
        containerPort: 8080
        servicePort: 8080
    service:
      enabled: true
    env:
      AUTO_CREATE_SESSIONS: "true"
      OTEL_SDK_DISABLED: "true"
  otelCollector:
    enabled: false
    kind: Deployment
    image: otelCollector
    replicas: 1
    args: ["--config=/etc/otel-collector-config.yaml"]
  jaeger:
    enabled: false
    kind: Deployment
    image: jaeger
    replicas: 1
  localstack:
    enabled: false
    kind: StatefulSet
    image: localstack
    replicas: 1
    env:
      DEBUG: "0"
    persistence:
      enabled: true
      size: 10Gi
      mountPath: /var/lib/localstack
  duckgres:
    enabled: false
    kind: StatefulSet
    image: duckgres
    replicas: 1
    args: ["--config", "/app/config.yaml"]
    persistence:
      enabled: true
      size: 10Gi
      mountPath: /app/data
  etcd:
    enabled: false
    kind: StatefulSet
    image: etcd
    replicas: 1
    ports:
      - name: client
        containerPort: 2379
        servicePort: 2379
    service:
      enabled: true
    command: ["/usr/local/bin/etcd"]
    args:
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    persistence:
      enabled: true
      size: 10Gi
      mountPath: /etcd-data

clickhouse:
  enabled: true
  operator:
    enabled: true
  clusterName: posthog
  image: clickhouse/clickhouse-server:26.3.9.8
  replicas: 1
  storage: 50Gi
  satelliteClusters: ""
  namedCollections:
    - msk_cluster
    - warpstream_ingestion
    - warpstream_calculated_events
    - warpstream_replay
  macros:
    hostClusterType: online
    hostClusterRole: data
  config:
    kafkaHosts: "{{ include \"posthog.kafkaHosts\" . }}"

postgresql:
  enabled: true
  fullnameOverride: db
  auth:
    username: posthog
    password: posthog
    database: posthog
    postgresPassword: posthog
  primary:
    persistence:
      enabled: true
      size: 20Gi
    initdb:
      scripts:
        01-create-posthog-dbs.sql: |
          CREATE DATABASE posthog_persons;
          CREATE DATABASE cyclotron;
          CREATE DATABASE posthog_flags;

redis:
  enabled: true
  fullnameOverride: redis7
  architecture: standalone
  auth:
    enabled: false
  master:
    extraFlags:
      - --maxmemory-policy
      - allkeys-lru
      - --maxmemory
      - 200mb
    persistence:
      enabled: true
      size: 8Gi

minio:
  enabled: true
  fullnameOverride: objectstorage
  auth:
    rootUser: object_storage_root_user
    rootPassword: object_storage_root_password
  defaultBuckets: posthog,ducklake-dev,ai-blobs
  service:
    ports:
      api: 9000
  console:
    enabled: false
  persistence:
    enabled: true
    size: 20Gi

redpanda:
  fullnameOverride: kafka
  external:
    enabled: false
    service:
      enabled: false
  console:
    enabled: false
  statefulset:
    replicas: 1
  tls:
    enabled: false
  listeners:
    kafka:
      port: 9092
  resources:
    cpu:
      cores: 1
    memory:
      container:
        max: 3Gi
  storage:
    persistentVolume:
      enabled: true
      size: 20Gi

zookeeper:
  enabled: true
  global:
    security:
      allowInsecureImages: true
  fullnameOverride: zookeeper
  image:
    repository: bitnamilegacy/zookeeper
    tag: "3.9"
  replicaCount: 1
  persistence:
    enabled: true
    size: 10Gi

grafana:
  enabled: false
loki:
  enabled: false
promtail:
  enabled: false
prometheus:
  enabled: false
cert-manager:
  enabled: false
