profile:
  mode: bundled

global:
  domain: posthog.local
  siteUrl: http://posthog.local
  deployment: hobby
  imagePullPolicy: Always
  imagePullSecrets: []
  labels: {}
  annotations: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  topologySpreadConstraints: []
  priorityClassName: ""
  # Applied to every workload unless the component sets its own. Unset means
  # the Kubernetes default of 30s; the Celery worker overrides it below.
  terminationGracePeriodSeconds: null
  allowMutableImageTags: true

subcharts:
  redpanda:
    enabled: true

kafka:
  defaultPartitions: 1
  defaultReplicationFactor: 1
  topics:
