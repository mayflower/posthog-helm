  plugins:
    enabled: true
    kind: Deployment
    image: node
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
    command: ["node", "nodejs/dist/index.js"]
    ports:
      - name: http
        containerPort: 6738
        servicePort: 6738
    service:
      enabled: true
    env:
      CDP_REDIS_HOST: "{{ include \"posthog.redisHost\" . }}"
      CDP_REDIS_PORT: "{{ include \"posthog.redisPort\" . }}"
      # server.ts throws "PersonHog client is required for CDP" without these.
      PERSONHOG_ADDR: "{{ include \"posthog.serviceAddress\" (dict \"root\" . \"name\" \"personhogRouter\" \"port\" 50052) }}"
      PERSONHOG_ENABLED: "true"
      # createCdpValkeyShadowPools throws without CDP_VALKEY_HOST: every CDP
      # process dual-writes to a second store. It must be a separate instance:
      # the rate limiters and hog watcher run the same token-bucket calls
      # against both pools, so one Redis behind both names gets every key
      # charged twice. The bundled valkeyShadow component below is that store.
      CDP_VALKEY_HOST: "{{ include \"posthog.valkeyHost\" . }}"
      CDP_VALKEY_PORT: "{{ include \"posthog.valkeyPort\" . }}"
      CDP_VALKEY_TLS: "{{ include \"posthog.valkeyTls\" . }}"
      # Renamed upstream: server.ts reads CYCLOTRON_NODE_DATABASE_URL at four
      # call sites and aborts without it ("required for
      # CdpCyclotronWorkerBatchResolve"). CYCLOTRON_DATABASE_URL is no longer
      # read anywhere in nodejs/src.
      CYCLOTRON_NODE_DATABASE_URL: "{{ include \"posthog.postgresUrl\" . }}"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    probes:
      readiness:
        httpGet:
          path: /_ready
          port: http
        initialDelaySeconds: 15
        periodSeconds: 10
  ingestionGeneral:
    enabled: true
    kind: Deployment
    image: node
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
    command: ["node", "nodejs/dist/index.js"]
    ports:
      - name: http
        containerPort: 6738
        servicePort: 6738
    probes:
      readiness:
        httpGet:
          path: /_ready
          port: http
        initialDelaySeconds: 15
        periodSeconds: 10
    env:
      PLUGIN_SERVER_MODE: ingestion-v2-combined
      CDP_REDIS_HOST: "{{ include \"posthog.redisHost\" . }}"
      # The AI scope hard-requires the client: PersonHogClientComponent.start()
      # throws when createPersonHogClient returns null.
      PERSONHOG_ADDR: "{{ include \"posthog.serviceAddress\" (dict \"root\" . \"name\" \"personhogRouter\" \"port\" 50052) }}"
      PERSONHOG_ENABLED: "true"
      # Cookieless tracking resolves its session hashes in Redis at ingestion
      # time. The Node pool for it takes a host but no password, and falls
      # back to the authenticated REDIS_URL when the host is empty, so the
      # host is only set when Redis needs no password.
      COOKIELESS_REDIS_HOST: "{{ include \"posthog.cookielessRedisHost\" . }}"
      COOKIELESS_REDIS_PORT: "{{ include \"posthog.redisPort\" . }}"
      # Combined mode consumes the events_plugin_ingestion_ai lane and owns AI
      # blob offload. Without a bucket, multimodal payloads are stored inline
      # instead of as blob references. The credentials expand from the object
      # storage secret commonEnv injects.
      AI_BLOB_S3_BUCKET: ai-blobs
      AI_BLOB_S3_PREFIX: aio/
      AI_BLOB_S3_ENDPOINT: "{{ include \"posthog.objectStorageEndpoint\" . }}"
      AI_BLOB_S3_REGION: "{{ include \"posthog.objectStorageRegion\" . }}"
      AI_BLOB_S3_ACCESS_KEY_ID: "$(OBJECT_STORAGE_ACCESS_KEY_ID)"
      AI_BLOB_S3_SECRET_ACCESS_KEY: "$(OBJECT_STORAGE_SECRET_ACCESS_KEY)"
      AI_BLOB_OFFLOAD_TEAMS: "*"
  ingestionSessionReplay:
    enabled: true
