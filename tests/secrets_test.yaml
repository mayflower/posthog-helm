suite: secrets
templates:
  - secrets.yaml
tests:
  - it: renders nothing when an existing secret is used
    set:
      secrets.create: false
      secrets.existingSecret: my-secrets
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps explicit values verbatim
    set:
      secrets.values.secretKey: explicit-secret-key
    asserts:
      - equal:
          path: stringData.SECRET_KEY
          value: explicit-secret-key

  - it: mints a 50 character SECRET_KEY when none is given
    asserts:
      - matchRegex:
          path: stringData.SECRET_KEY
          pattern: ^[A-Za-z0-9]{50}$
