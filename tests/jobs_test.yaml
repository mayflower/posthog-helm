suite: jobs
templates:
  - jobs.yaml
  - secrets.yaml
tests:
  - it: runs migrations post-install and pre-upgrade with a deadline
    template: jobs.yaml
    documentSelector:
      path: metadata.labels["app.kubernetes.io/component"]
      value: migrate
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,pre-upgrade
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: Sync
      - equal:
          path: spec.activeDeadlineSeconds
          value: 3600
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 86400

  - it: orders kafka topics before migrations
    template: jobs.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-5"
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: kafka-init
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "0"
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: migrate
