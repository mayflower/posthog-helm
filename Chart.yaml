apiVersion: v2
name: posthog
description: Current Helm chart for the PostHog Kubernetes service topology.
type: application
version: 0.6.5
appVersion: "master"
kubeVersion: ">=1.28.0-0"
home: https://posthog.com
icon: https://raw.githubusercontent.com/PostHog/posthog/master/frontend/public/posthog-icon.svg
keywords:
  - posthog
  - analytics
  - product-analytics
  - session-replay
  - feature-flags
  - clickhouse
maintainers:
  - name: Johann-Peter Hartmann
    url: https://github.com/johannhartmann
sources:
  - https://github.com/mayflower/posthog-helm
  - https://github.com/PostHog/posthog
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: changed
      description: Bundled Postgres and ZooKeeper are chart-native StatefulSets on the official images; no Bitnami images remain
    - kind: added
      description: Image digests, restricted pod security defaults, resource requests, readiness probes, NetworkPolicy, config checksums
    - kind: changed
      description: Bundled Redis and MinIO replaced by chart-native Valkey and SeaweedFS components
    - kind: removed
      description: cert-manager, Prometheus, Grafana, Loki and Promtail are no longer chart dependencies
dependencies:
  - name: redpanda
    version: 26.1.3
    repository: https://charts.redpanda.com
    condition: subcharts.redpanda.enabled
  - name: altinity-clickhouse-operator
    version: 0.27.0
    repository: https://docs.altinity.com/clickhouse-operator
    condition: clickhouse.operator.enabled
